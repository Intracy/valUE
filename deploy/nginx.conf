server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Scanner schickt Fotos bis etwa 6 MB.
  client_max_body_size 8m;

  location /v1/ {
    proxy_pass http://api:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
  location = /readyz { proxy_pass http://api:8787; }

  # Vorgerenderte Seiten mit Platzhalter im Namen ([cardId].html, [setId].html).
  location ~ ^/karte/[^/]+$ { try_files $uri "/karte/[cardId].html" /index.html; }
  location ~ ^/sammlung/[^/]+$ { try_files $uri "/sammlung/[setId].html" /index.html; }

  location / {
    try_files $uri $uri.html $uri/index.html /index.html;
  }

  # Gebaute Dateien tragen einen Hash im Namen und ändern sich nie.
  location /_expo/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
