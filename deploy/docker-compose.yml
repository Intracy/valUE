# valUE als Test-Installation: Datenbank, API-Server, Katalogabgleich und Web-App.
# Start:  docker compose -f deploy/docker-compose.yml up -d --build
# Die Web-App ist danach auf Port 8095 erreichbar (über Tailscale siehe deploy/README.md).
name: value

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: value
      POSTGRES_PASSWORD: value
      POSTGRES_DB: value
    volumes:
      - value-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U value"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://value:value@db:5432/value
      # Echte Karten kommen vom Dienst "catalog". "true" spielt stattdessen Demo-Daten ein.
      SEED_DEMO: "false"
      TRUST_PROXY: "true"
      SCAN_OCR_WORKERS: "1"

  # Katalog von TCGdex (Englisch, Deutsch, Japanisch, rund 57.000 Karten),
  # Fingerabdrücke für den Scanner und Preise von Pokemon Price Tracker. Läuft
  # beim Start und danach alle 24 Stunden. Der erste Lauf dauert ein bis zwei Stunden.
  catalog:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://value:value@db:5432/value
      # Schlüssel nur auf der NAS in /volume1/docker/valUE.env, nie im Repository.
      PPT_API_KEY: ${PPT_API_KEY:-}
      SYNC_SETS: ${SYNC_SETS:-Celebrations}
      CATALOG_CONCURRENCY: "6"
    healthcheck:
      disable: true
    command: ["sh", "-c", "while true; do npx tsx src/sync/catalog-cli.ts; sleep 86400; done"]

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8095:80"

volumes:
  value-db:
